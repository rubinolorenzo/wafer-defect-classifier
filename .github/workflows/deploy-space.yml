name: deploy demo to Hugging Face

# Publishes the Gradio demo (app.py + src/ + models/) to a Hugging Face Space
# on every push to main. Needs a repository secret HF_TOKEN (a Hugging Face
# token with write access). The Space name defaults to
# rubinolorenzo/wafer-defect-classifier; set a repository variable HF_SPACE
# to use another one.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'rubinolorenzo/wafer-defect-classifier' }}
    steps:
      - name: Check that the token is set
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN secret not set: skipping the Hugging Face deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Build the Space folder
        if: steps.token.outputs.ok == 'true'
        run: |
          mkdir space
          cp -r app.py src models space/
          # Gradio is provided by the Space itself; CPU-only PyTorch keeps the build small
          cat > space/requirements.txt <<'EOF'
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch
          numpy
          pandas
          scikit-learn
          scipy
          matplotlib
          EOF
          cat > space/README.md <<EOF
          ---
          title: Wafer Defect Classifier
          emoji: 🔬
          colorFrom: blue
          colorTo: gray
          sdk: gradio
          app_file: app.py
          pinned: false
          license: mit
          short_description: Wafer map defect patterns with Grad-CAM and root causes
          ---

          # Wafer map defect classifier

          Recognises 9 failure patterns on semiconductor wafer maps (trained on WM-811K),
          shows where the model looked, flags uncertain wafers for an engineer and suggests
          which process step to investigate.

          Code, method and results: https://github.com/${GITHUB_REPOSITORY}
          EOF
          sed -i 's/^          //' space/requirements.txt space/README.md
          find space -name __pycache__ -prune -exec rm -rf {} +
          find space -type f | sort

      - name: Upload to the Space
        if: steps.token.outputs.ok == 'true'
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              commit_message=f"Sync from GitHub {os.environ['GITHUB_SHA'][:7]}",
          )
          print(f"Deployed: https://huggingface.co/spaces/{space}")
          EOF
