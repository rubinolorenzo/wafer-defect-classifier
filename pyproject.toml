[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafermap"
version = "0.1.0"
description = "Wafer map defect pattern classification on WM-811K, with Grad-CAM and a root-cause guide"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]
demo = ["gradio"]
web = ["onnx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
